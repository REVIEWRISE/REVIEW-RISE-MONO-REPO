# ============================================
# NGINX PRODUCTION CONFIGURATION
# ============================================
# Reverse proxy for Review Rise monorepo services
# ============================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_http_version 1.1;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml
               font/woff font/woff2;

    # Client body size limit
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # Proxy timeouts — 120s to accommodate long-running AI responses
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Upstream definitions for backend services
    upstream next_web {
        server next-web:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream next_seo_landing {
        server next-seo-landing:3001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream vyntrise_auth_ui {
        server 172.17.0.1:3002 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream express_auth {
        server express-auth:3010 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ── vyntrise-auth-mono (separate stack) ──────────────────────────────────
    upstream vyntrise_auth_mono_ui {
        # Next.js frontend — vyntrise-auth-mono (port 3002)
        server 172.17.0.1:3002 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream vyntrise_auth_mono_api {
        # Express backend — vyntrise-auth-mono (port 3021)
        server 172.17.0.1:3021 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream express_reviews {
        server express-reviews:3006 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream express_ai {
        server express-ai:3002 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream express_social {
        server express-social:3003 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream express_gbp_rocket {
        server express-gbp-rocket:3004 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream express_ad_rise {
        server express-ad-rise:3005 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream express_brand {
        server express-brand:3007 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream express_seo_health {
        server express-seo-health:3011 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream express_admin_portal {
        server express-admin-portal:3012 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream notifications_service {
        server notifications-service:3008 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ── Vyntrize production ──────────────────────────────────────────────────
    # deploy-vyntrize-website-1 / deploy-vyntrize-crm-1 are containers from the
    # separate vyntrize repo's production compose stack — not present on this
    # host. Disabled (with their server blocks below) until that stack is
    # actually deployed here; re-enabling before then repeats the 2026-08-20
    # outage described below.
    # upstream vyntrize_website {
    #     server deploy-vyntrize-website-1:3013 max_fails=3 fail_timeout=30s;
    #     keepalive 32;
    # }

    # upstream vyntrize_crm {
    #     server deploy-vyntrize-crm-1:3014 max_fails=3 fail_timeout=30s;
    #     keepalive 32;
    # }

    # ── Vyntrize staging ─────────────────────────────────────────────────────
    # Container names come from the Compose project name in the vyntrize repo's
    # deploy/docker-compose.staging.yml (started with -p vyntrize-staging).
    #
    # nginx resolves these once at startup and treats a name it cannot resolve
    # as fatal, so these blocks must not be deployed before the containers
    # exist. Committing them early took every site on this host down on
    # 2026-08-20 — nginx crash-looped and there is no partial failure mode.
    upstream vyntrize_staging_website {
        server vyntrize-staging-vyntrize-website-1:3013 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream vyntrize_staging_crm {
        server vyntrize-staging-vyntrize-crm-1:3014 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream ai_assistant_app {
        # Same server, different deployment — not part of this stack.
        # Uses Docker host gateway so nginx container can reach host port 3015.
        server 172.17.0.1:3015 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream vyntrise_sms {
        server 172.17.0.1:3016 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ── vyntrise-billing (separate stack) ────────────────────────────────────
    # Billing containers expose ports to the host (3030, 3031).
    # Nginx reaches them via the Docker host gateway since they are on a
    # separate internal network (vyntrise-billing_billing-network).
    upstream vyntrise_billing_frontend {
        server 172.17.0.1:3030 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream vyntrise_billing_backend {
        server 172.17.0.1:3031 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    
    # =========================================================================
    # DEFAULT SERVER (Health Checks & Unknown Domains)
    # =========================================================================
    server {
        listen 80 default_server;
        server_name _;

        # Health check endpoint for Docker/Load Balancer
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ACME Challenge Rule
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Return 404 for unknown domains
        location / {
            return 404;
        }
    }

    # =========================================================================
    # MARKETING SITE (Landing Page)
    # Domain: seo-analyzer.vyntrise.com
    # =========================================================================
    server {
        listen 80;
        server_name seo-analyzer.vyntrise.com www.seo-analyzer.vyntrise.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://seo-analyzer.vyntrise.com$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name www.seo-analyzer.vyntrise.com;

        ssl_certificate /etc/letsencrypt/live/seo-analyzer.vyntrise.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/seo-analyzer.vyntrise.com/privkey.pem;

        location / {
            return 301 https://seo-analyzer.vyntrise.com$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name seo-analyzer.vyntrise.com;

        # SSL configuration (common)
        ssl_certificate /etc/letsencrypt/live/seo-analyzer.vyntrise.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/seo-analyzer.vyntrise.com/privkey.pem;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ---- SEO API proxy -----------------------------------------------
        # The Next.js landing app calls /api/v1/seo/analyze from the browser.
        # Forward those requests directly to the express-seo-health service
        # so we don't need a Next.js API route or a Docker image rebuild.
        location /api/v1/seo/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://express_seo_health/seo/;
            include /etc/nginx/proxy_params.conf;
        }
        # ------------------------------------------------------------------

        # Route to SEO Landing Service
        location / {
            proxy_pass http://next_seo_landing;
            include /etc/nginx/proxy_params.conf;
        }

        location /_next/static/ {
            proxy_pass http://next_seo_landing;
            proxy_cache_valid 200 60m;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
   # =========================================================================
