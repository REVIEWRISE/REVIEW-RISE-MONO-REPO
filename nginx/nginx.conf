# ============================================
# NGINX PRODUCTION CONFIGURATION
# ============================================
# Reverse proxy for Review Rise monorepo services
# ============================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_http_version 1.1;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml
               font/woff font/woff2;

    # Client body size limit
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # Proxy timeouts — 120s to accommodate long-running AI responses
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Upstream definitions for backend services
    upstream next_web {
        server next-web:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream next_seo_landing {
        server next-seo-landing:3001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream vyntrise_auth_ui {
        server 172.17.0.1:3002 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream express_auth {
        server express-auth:3010 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ── vyntrise-auth-mono (separate stack) ──────────────────────────────────
    upstream vyntrise_auth_mono_ui {
        # Next.js frontend — vyntrise-auth-mono (port 3020)
        server 172.17.0.1:3020 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream vyntrise_auth_mono_api {
        # Express backend — vyntrise-auth-mono (port 3021)
        server 172.17.0.1:3021 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream express_reviews {
        server express-reviews:3006 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream express_ai {
        server express-ai:3002 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream express_social {
        server express-social:3003 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream express_gbp_rocket {
        server express-gbp-rocket:3004 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream express_ad_rise {
        server express-ad-rise:3005 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream express_brand {
        server express-brand:3007 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream express_seo_health {
        server express-seo-health:3011 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream express_admin_portal {
        server express-admin-portal:3012 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream notifications_service {
        server notifications-service:3008 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream vyntrize_website {
        server deploy-vyntrize-website-1:3013 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream vyntrize_crm {
        server deploy-vyntrize-crm-1:3014 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream ai_assistant_app {
        # Same server, different deployment — not part of this stack.
        # Uses Docker host gateway so nginx container can reach host port 3015.
        server 172.17.0.1:3015 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream vyntrise_sms {
        server 172.17.0.1:3016 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    
    # =========================================================================
    # DEFAULT SERVER (Health Checks & Unknown Domains)
    # =========================================================================
    server {
        listen 80 default_server;
        server_name _;

        # Health check endpoint for Docker/Load Balancer
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ACME Challenge Rule
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Return 404 for unknown domains
        location / {
            return 404;
        }
    }

    # =========================================================================
    # MARKETING SITE (Landing Page)
    # Domain: seo-analyzer.vyntrise.com
    # =========================================================================
    server {
        listen 80;
        server_name seo-analyzer.vyntrise.com www.seo-analyzer.vyntrise.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://seo-analyzer.vyntrise.com$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name www.seo-analyzer.vyntrise.com;

        ssl_certificate /etc/letsencrypt/live/seo-analyzer.vyntrise.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/seo-analyzer.vyntrise.com/privkey.pem;

        location / {
            return 301 https://seo-analyzer.vyntrise.com$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name seo-analyzer.vyntrise.com;

        # SSL configuration (common)
        ssl_certificate /etc/letsencrypt/live/seo-analyzer.vyntrise.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/seo-analyzer.vyntrise.com/privkey.pem;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ---- SEO API proxy -----------------------------------------------
        # The Next.js landing app calls /api/v1/seo/analyze from the browser.
        # Forward those requests directly to the express-seo-health service
        # so we don't need a Next.js API route or a Docker image rebuild.
        location /api/v1/seo/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://express_seo_health/seo/;
            include /etc/nginx/proxy_params.conf;
        }
        # ------------------------------------------------------------------

        # Route to SEO Landing Service
        location / {
            proxy_pass http://next_seo_landing;
            include /etc/nginx/proxy_params.conf;
        }

        location /_next/static/ {
            proxy_pass http://next_seo_landing;
            proxy_cache_valid 200 60m;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
   # =========================================================================
# VYNTRIZE WEBSITE — HTTP
# Bare domain redirects to www canonical; www redirects to HTTPS
# =========================================================================

# HTTP: Redirect all bare & www HTTP traffic to HTTPS canonical (https://vyntrise.com)
server {
    listen 80;
    server_name vyntrise.com www.vyntrise.com;

    # ACME Challenge must stay accessible for SSL renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://vyntrise.com$request_uri;
    }
}

# HTTPS: www.vyntrise.com → https://vyntrise.com (301)
server {
    listen 443 ssl;
    http2 on;
    server_name www.vyntrise.com;

    ssl_certificate /etc/letsencrypt/live/vyntrise.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vyntrise.com/privkey.pem;

    location / {
        return 301 https://vyntrise.com$request_uri;
    }
}

# HTTPS: bare vyntrise.com — canonical, serving block
server {
    listen 443 ssl;
    http2 on;
    server_name vyntrise.com;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/vyntrise.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vyntrise.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location / {
        proxy_pass http://vyntrize_website;
        include /etc/nginx/proxy_params.conf;
    }

    location /_next/static/ {
        proxy_pass http://vyntrize_website;
        proxy_cache_valid 200 60m;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# =========================================================================
# VYNTRIZE CRM
# Domain: crm.vyntrise.com
# =========================================================================
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name crm.vyntrise.com;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/crm.vyntrise.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.vyntrise.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://vyntrize_crm;
        include /etc/nginx/proxy_params.conf;
    }

    location /_next/static/ {
        proxy_pass http://vyntrize_crm;
        proxy_cache_valid 200 60m;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# =========================================================================
# VYNTRISE AUTH
# Domain: auth.vyntrise.com
# Frontend → vyntrise-auth-mono frontend (host:3020)
# API     → vyntrise-auth-mono backend  (host:3021)
# =========================================================================
server {
    listen 80;
    server_name auth.vyntrise.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name auth.vyntrise.com;

    ssl_certificate /etc/letsencrypt/live/auth.vyntrise.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.vyntrise.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API — proxy to Express backend (preserve /api/ prefix)
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://vyntrise_auth_mono_api/api/;
        include /etc/nginx/proxy_params.conf;
    }

    # Frontend — proxy to Next.js
    location / {
        proxy_pass http://vyntrise_auth_mono_ui;
        include /etc/nginx/proxy_params.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /_next/static/ {
        proxy_pass http://vyntrise_auth_mono_ui;
        proxy_cache_valid 200 60m;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

    # =========================================================================
    # AI AGENT
    # Domain: agent.vyntrise.com
    # =========================================================================
    server {
        listen 80;
        server_name agent.vyntrise.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name agent.vyntrise.com;

        ssl_certificate /etc/letsencrypt/live/agent.vyntrise.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/agent.vyntrise.com/privkey.pem;

        # X-Frame-Options intentionally omitted — CSP frame-ancestors takes precedence
        # and having both can cause conflicts in some browsers.
        add_header Content-Security-Policy "frame-ancestors 'self' https://www.vyntrise.com https://vyntrise.com https://crm.vyntrise.com http://localhost:3000 http://localhost:3001 http://localhost:3013 http://localhost:3014" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location / {
            proxy_pass http://ai_assistant_app;
            include /etc/nginx/proxy_params.conf;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Show a clean 503 if the agent app isn't running yet
            error_page 502 503 504 = @agent_unavailable;
        }

        location @agent_unavailable {
            return 503 '{"error":"Agent service is not available yet","status":503}';
            add_header Content-Type application/json always;
        }
    }

    # =========================================================================
    # WEB APPLICATION & API
    # Domain: app.vyntrise.com
    # =========================================================================
    server {
        listen 80;
        listen 443 ssl;
        http2 on;
        server_name app.vyntrise.com;

        # SSL configuration (common)
        ssl_certificate /etc/letsencrypt/live/app.vyntrise.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.vyntrise.com/privkey.pem;

        # Health check fallback
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ACME Challenge Rule
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # ---------------------------------------------------------------------
        # API Routes - Backend Microservices
        # ---------------------------------------------------------------------
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            rewrite ^/api/auth/(.*) /api/v1/auth/$1 break;
            proxy_pass http://express_auth;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/reviews/ {
            limit_req zone=api_limit burst=20 nodelay;
            rewrite ^/api/reviews/(.*)$ /api/v1/$1 break;
            proxy_pass http://express_reviews;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/ai/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://express_ai/;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/social/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://express_social/;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/gbp/ {
            limit_req zone=api_limit burst=20 nodelay;
            rewrite ^/api/gbp/(.*)$ /api/v1/$1 break;
            proxy_pass http://express_gbp_rocket;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/ads/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://express_ad_rise/;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/brand/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://express_brand/;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/seo/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://express_seo_health/;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/admin/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://express_admin_portal/;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/notifications/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://notifications_service/;
            include /etc/nginx/proxy_params.conf;
        }

        # ---------------------------------------------------------------------
        # Next.js Frontend (App) - Default route
        # ---------------------------------------------------------------------
        location / {
            proxy_pass http://next_web;
            include /etc/nginx/proxy_params.conf;
            
            # Next.js specific headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Static files from Next.js
        location /_next/static/ {
            proxy_pass http://next_web;
            proxy_cache_valid 200 60m;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # =========================================================================
    # VYNTRISESMS
    # Domain: sms.vyntrise.com
    # =========================================================================
    server {
        listen 80;
        listen 443 ssl;
        http2 on;
        server_name sms.vyntrise.com;

        # SSL configuration
        ssl_certificate /etc/letsencrypt/live/sms.vyntrise.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sms.vyntrise.com/privkey.pem;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ACME Challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://vyntrise_sms;
            include /etc/nginx/proxy_params.conf;
            
            # Next.js specific headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /_next/static/ {
            proxy_pass http://vyntrise_sms;
            proxy_cache_valid 200 60m;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
