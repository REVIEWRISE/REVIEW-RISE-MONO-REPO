# =========================================================================
# VYNTRIZE STAGING
# Domains: crm.staging.vyntrise.com, website.staging.vyntrise.com
#
# Pre-production copies of the two apps above. Staging deploys from main;
# production deploys from version tags.
#
# noindex on both: staging serves the same marketing copy as the live site,
# and letting it be indexed would compete with vyntrise.com for its own
# content.
#
# One certificate covers both names. Let's Encrypt names the lineage after the
# first -d argument, which is why the website block below points at the
# crm.staging path — it is a SAN on that certificate, not a copy-paste slip.
# =========================================================================
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name crm.staging.vyntrise.com;

    ssl_certificate /etc/letsencrypt/live/crm.staging.vyntrise.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.staging.vyntrise.com/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://vyntrize_staging_crm;
        include /etc/nginx/proxy_params.conf;
    }

    location /_next/static/ {
        proxy_pass http://vyntrize_staging_crm;
        proxy_cache_valid 200 60m;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name website.staging.vyntrise.com;

    ssl_certificate /etc/letsencrypt/live/crm.staging.vyntrise.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.staging.vyntrise.com/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://vyntrize_staging_website;
        include /etc/nginx/proxy_params.conf;
    }

    location /_next/static/ {
        proxy_pass http://vyntrize_staging_website;
        proxy_cache_valid 200 60m;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# =========================================================================
# VYNTRISE AUTH
# Domain: auth.vyntrise.com
# Frontend → vyntrise-auth-mono frontend (host:3020)
# API     → vyntrise-auth-mono backend  (host:3021)
# =========================================================================
server {
    listen 80;
    server_name auth.vyntrise.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name auth.vyntrise.com;

    ssl_certificate /etc/letsencrypt/live/auth.vyntrise.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.vyntrise.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API — proxy to Express backend (preserve /api/ prefix)
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://vyntrise_auth_mono_api/api/;
        include /etc/nginx/proxy_params.conf;
    }

    # Frontend — proxy to Next.js
    location / {
        proxy_pass http://vyntrise_auth_mono_ui;
        include /etc/nginx/proxy_params.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /_next/static/ {
        proxy_pass http://vyntrise_auth_mono_ui;
        proxy_cache_valid 200 60m;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

    # =========================================================================
    # AI AGENT
    # Domain: agent.staging.vyntrise.com
    # =========================================================================
    server {
        listen 80;
        server_name agent.staging.vyntrise.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name agent.staging.vyntrise.com;

        ssl_certificate /etc/letsencrypt/live/agent.staging.vyntrise.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/agent.staging.vyntrise.com/privkey.pem;

        # X-Frame-Options intentionally omitted — CSP frame-ancestors takes precedence
        # and having both can cause conflicts in some browsers.
        add_header Content-Security-Policy "frame-ancestors 'self' https://www.vyntrise.com https://vyntrise.com https://crm.vyntrise.com http://localhost:3000 http://localhost:3001 http://localhost:3013 http://localhost:3014" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location / {
            proxy_pass http://ai_assistant_app;
            include /etc/nginx/proxy_params.conf;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Show a clean 503 if the agent app isn't running yet
            error_page 502 503 504 = @agent_unavailable;
        }

        location @agent_unavailable {
            return 503 '{"error":"Agent service is not available yet","status":503}';
            add_header Content-Type application/json always;
        }
    }
    # =========================================================================
    # BACKUP MANAGER (staging)
    # Domain: backups.staging.vyntrise.com
    # =========================================================================
    server {
        listen 80;
        server_name backups.staging.vyntrise.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name backups.staging.vyntrise.com;

        ssl_certificate /etc/letsencrypt/live/backups.staging.vyntrise.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/backups.staging.vyntrise.com/privkey.pem;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location / {
            proxy_pass http://backup_manager:8090;
            include /etc/nginx/proxy_params.conf;
        }
    }


    # =========================================================================
    # AI AGENT LLM
    # Domain: agentllm.vyntrise.com
    # =========================================================================
    server {
        listen 80;
        server_name agentllm.vyntrise.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name agentllm.vyntrise.com;

        ssl_certificate /etc/letsencrypt/live/agentllm.vyntrise.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/agentllm.vyntrise.com/privkey.pem;

        add_header Content-Security-Policy "frame-ancestors 'self' https://www.vyntrise.com https://vyntrise.com https://crm.vyntrise.com http://localhost:3000 http://localhost:3001 http://localhost:3013 http://localhost:3014" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # WebSocket handled by the retell-llm container (port 3017)
        location /llm-websocket/ {
            proxy_pass http://172.17.0.1:3017;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location / {
            proxy_pass http://ai_assistant_app;
            include /etc/nginx/proxy_params.conf;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            error_page 502 503 504 = @agentllm_unavailable;
        }

        location @agentllm_unavailable {
            return 503 '{"error":"Agent LLM service is not available yet","status":503}';
            add_header Content-Type application/json always;
        }
    }

    # =========================================================================
    # WEB APPLICATION & API
    # Domain: app.vyntrise.com
    # =========================================================================
    server {
        listen 80;
        listen 443 ssl;
        http2 on;
        server_name app.vyntrise.com;

        # SSL configuration (common)
        ssl_certificate /etc/letsencrypt/live/app.vyntrise.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.vyntrise.com/privkey.pem;

        # Health check fallback
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ACME Challenge Rule
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # ---------------------------------------------------------------------
        # API Routes - Backend Microservices
        # ---------------------------------------------------------------------
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            rewrite ^/api/auth/(.*) /api/v1/auth/$1 break;
            proxy_pass http://express_auth;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/reviews/ {
            limit_req zone=api_limit burst=20 nodelay;
            rewrite ^/api/reviews/(.*)$ /api/v1/$1 break;
            proxy_pass http://express_reviews;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/ai/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://express_ai/;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/social/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://express_social/;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/gbp/ {
            limit_req zone=api_limit burst=20 nodelay;
            rewrite ^/api/gbp/(.*)$ /api/v1/$1 break;
            proxy_pass http://express_gbp_rocket;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/ads/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://express_ad_rise/;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/brand/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://express_brand/;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/seo/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://express_seo_health/;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/admin/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://express_admin_portal/;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/notifications/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://notifications_service/;
            include /etc/nginx/proxy_params.conf;
        }

        # ---------------------------------------------------------------------
        # Next.js Frontend (App) - Default route
        # ---------------------------------------------------------------------
        location / {
            proxy_pass http://next_web;
            include /etc/nginx/proxy_params.conf;
            
            # Next.js specific headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Static files from Next.js
        location /_next/static/ {
            proxy_pass http://next_web;
            proxy_cache_valid 200 60m;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # =========================================================================
    # VYNTRISESMS
    # Domain: sms.vyntrise.com
    # =========================================================================
    server {
        listen 80;
        listen 443 ssl;
        http2 on;
        server_name sms.vyntrise.com;

        # SSL configuration
        ssl_certificate /etc/letsencrypt/live/sms.vyntrise.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sms.vyntrise.com/privkey.pem;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ACME Challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://vyntrise_sms;
            include /etc/nginx/proxy_params.conf;
            
            # Next.js specific headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /_next/static/ {
            proxy_pass http://vyntrise_sms;
            proxy_cache_valid 200 60m;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # =========================================================================
    # VYNTRISE BILLING
    # Domain: billing.vyntrise.com
    # Frontend → vyntrise-billing-frontend (port 3030)
    # API     → vyntrise-billing-backend  (port 3031)
    # =========================================================================

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name billing.vyntrise.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://billing.vyntrise.com$request_uri;
        }
    }

    # HTTPS — full billing config (cert issued 2026-07-20)
    server {
        listen 443 ssl;
        http2 on;
        server_name billing.vyntrise.com;

        ssl_certificate /etc/letsencrypt/live/billing.vyntrise.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/billing.vyntrise.com/privkey.pem;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # ACME Challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # ── Stripe webhook — no rate limiting (raw body required) ────────────
        location /api/v1/billing/webhooks {
            proxy_pass http://vyntrise_billing_backend;
            include /etc/nginx/proxy_params.conf;
            client_max_body_size 1M;
            client_body_buffer_size 32k;
        }

        # ── Billing API (all other endpoints) ────────────────────────────────
        location /api/v1/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://vyntrise_billing_backend;
            include /etc/nginx/proxy_params.conf;
        }

        # ── Next.js static assets ─────────────────────────────────────────────
        location /_next/static/ {
            proxy_pass http://vyntrise_billing_frontend;
            proxy_cache_valid 200 60m;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ── Next.js admin portal (frontend catch-all) ─────────────────────────
        location / {
            proxy_pass http://vyntrise_billing_frontend;
            include /etc/nginx/proxy_params.conf;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
